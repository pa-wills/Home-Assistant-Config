name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Use placeholder secrets
        run: cp secrets.example.yaml secrets.yaml

      - name: Install custom components (Escea, used by the logger config)
        run: |
          mkdir -p custom_components
          git clone --depth 1 https://github.com/snikch/climate.escea.git /tmp/escea
          cp -r /tmp/escea/custom_components/escea custom_components/

      - name: Home Assistant check_config
        run: hass --script check_config -c .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install yamllint ruff
      - run: yamllint --no-warnings .
      - run: ruff check --select E9,F821,F811 appdaemon
